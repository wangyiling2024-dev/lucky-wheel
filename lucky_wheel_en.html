<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Spin Wheel</title>
<style>
  :root{
    --bg1:#0f2027;
    --bg2:#203a43;
    --bg3:#2c5364;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:radial-gradient(circle at 50% 0%, #16324f 0%, #0b1d33 60%, #060f1c 100%);
    color:#fff;
    overflow-x:hidden;
    padding:24px 16px 60px;
  }
  h1{
    font-size:28px;
    margin:8px 0 4px;
    letter-spacing:2px;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .sub{
    color:#9fd3e0;
    margin-bottom:18px;
    font-size:14px;
    letter-spacing:1px;
  }
  .wheel-wrap{
    position:relative;
    width:min(88vw, 380px);
    height:min(88vw, 380px);
    margin:10px auto 28px;
  }
  .pointer{
    position:absolute;
    top:-18px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-top:30px solid #ffd93d;
    z-index:5;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
  }
  .rim{
    position:absolute;
    inset:-8px;
    border-radius:50%;
    background:conic-gradient(from 0deg,#ffd93d,#ff6b6b,#4ecdc4,#ffd93d);
    box-shadow:0 0 0 4px rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.5);
  }
  .wheel{
    position:absolute;
    inset:8px;
    border-radius:50%;
    overflow:hidden;
    transition:transform 5.5s cubic-bezier(.17,.67,.16,1);
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.25);
    background:#111;
  }
  .wheel svg{
    width:100%;
    height:100%;
    display:block;
  }
  .hub{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:22%;
    height:22%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #ffd93d 45%, #ff9f1c 100%);
    box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 0 0 3px #fff;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
  }
  .spin-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    padding:14px 42px;
    font-size:18px;
    font-weight:700;
    letter-spacing:2px;
    border-radius:40px;
    color:#1a1a1a;
    background:linear-gradient(135deg,#ffd93d,#ff9f1c);
    box-shadow:0 6px 0 #c97300, 0 10px 20px rgba(0,0,0,.4);
    transition:transform .08s ease;
  }
  .spin-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #c97300, 0 4px 10px rgba(0,0,0,.4);
  }
  .spin-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    box-shadow:none;
    transform:none;
  }
  .result{
    margin-top:22px;
    min-height:40px;
    font-size:20px;
    font-weight:700;
    text-align:center;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:26px;
    max-width:360px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    font-size:13px;
  }
  .dot{
    width:10px;height:10px;border-radius:50%;
    display:inline-block;
  }
  .confetti{
    position:fixed;
    top:-10px;
    pointer-events:none;
    border-radius:2px;
    z-index:50;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0; }
  }
</style>
</head>
<body>

<h1>🎉 Lucky Spin Wheel 🎉</h1>
<div class="sub">Tap the button to spin and win your prize</div>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <div class="rim"></div>
  <div class="wheel" id="wheel">
    <svg viewBox="0 0 300 300" id="wheelSvg"></svg>
  </div>
  <div class="hub">🎁</div>
</div>

<button class="spin-btn" id="spinBtn">SPIN NOW</button>
<div class="result" id="result"></div>

<div class="legend" id="legend"></div>

<script>
// Three prizes repeated across 9 colorful segments
const prizes = [
  { name: "Sticker",      color: "#ff6b6b" },
  { name: "Candy",        color: "#4ecdc4" },
  { name: "Fridge Magnet",color: "#ffd93d" },
  { name: "Sticker",      color: "#845ec2" },
  { name: "Candy",        color: "#ff9f1c" },
  { name: "Fridge Magnet",color: "#2ec4b6" },
  { name: "Sticker",      color: "#ff6f91" },
  { name: "Candy",        color: "#00c2a8" },
  { name: "Fridge Magnet",color: "#f9c74f" }
];

const N = prizes.length;
const svg = document.getElementById('wheelSvg');
const cx = 150, cy = 150, r = 150;
const anglePer = 360 / N;

function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

prizes.forEach((p, i) => {
  const startAngle = i * anglePer;
  const endAngle = startAngle + anglePer;
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = anglePer > 180 ? 1 : 0;
  const pathData = [
    `M ${cx} ${cy}`,
    `L ${start.x} ${start.y}`,
    `A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y}`,
    'Z'
  ].join(' ');

  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", pathData);
  path.setAttribute("fill", p.color);
  path.setAttribute("stroke", "rgba(255,255,255,0.55)");
  path.setAttribute("stroke-width", "1.5");
  svg.appendChild(path);

  // 文字标签
  const midAngle = startAngle + anglePer / 2;
  const textPos = polarToCartesian(cx, cy, r * 0.62, midAngle);
  const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  text.setAttribute("x", textPos.x);
  text.setAttribute("y", textPos.y);
  text.setAttribute("fill", "#1a1a1a");
  text.setAttribute("font-size", p.name.length > 8 ? "9.5" : "13");
  text.setAttribute("font-weight", "700");
  text.setAttribute("text-anchor", "middle");
  text.setAttribute("dominant-baseline", "middle");
  text.setAttribute("transform", `rotate(${midAngle}, ${textPos.x}, ${textPos.y})`);
  text.textContent = p.name;
  svg.appendChild(text);
});

// legend
const legend = document.getElementById('legend');
const uniquePrizes = [...new Map(prizes.map(p => [p.name, p])).values()];
uniquePrizes.forEach(p => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.name}`;
  legend.appendChild(chip);
});

let currentRotation = 0;
let spinning = false;
const wheel = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
const resultEl = document.getElementById('result');

function launchConfetti(){
  const colors = ["#ff6b6b","#ffd93d","#4ecdc4","#845ec2","#ff9f1c","#00c2a8"];
  for(let i=0;i<40;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 6 + Math.random()*6;
    c.style.width = size+'px';
    c.style.height = size*0.6+'px';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animation = `fall ${2 + Math.random()*1.5}s linear forwards`;
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3600);
  }
}

spinBtn.addEventListener('click', () => {
  if(spinning) return;
  spinning = true;
  spinBtn.disabled = true;
  resultEl.textContent = "";

  const winnerIndex = Math.floor(Math.random() * N);
  // 目标：让指针（正上方，0度）指向 winnerIndex 格子的中心
  const targetCenter = winnerIndex * anglePer + anglePer / 2;
  const fullSpins = 6 + Math.floor(Math.random()*3); // 6~8圈
  // 转盘顺时针转动，最终使 targetCenter 对齐到 0度（顶部指针）
  const finalRotation = fullSpins * 360 + (360 - targetCenter);
  currentRotation += finalRotation;

  wheel.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(() => {
    const prize = prizes[winnerIndex];
    resultEl.textContent = `🎊 You won: ${prize.name}! 🎊`;
    launchConfetti();
    spinning = false;
    spinBtn.disabled = false;
  }, 5600);
});
</script>

</body>
</html>
